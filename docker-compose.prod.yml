# Deploy rápido para VPS / qualquer host Docker.
#   docker compose -f docker-compose.prod.yml up -d
#
# Stack: PostgreSQL + backend Node + frontend nginx.
# Acesso: http://localhost
#
# Copie .env.example para .env e ajuste os segredos antes de subir.

services:
  postgres:
    image: postgres:16-alpine
    container_name: essencia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-essencia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-essencia}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-essencia} -d ${POSTGRES_DB:-essencia}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta exposta: só a rede interna do compose fala com o postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: essencia-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER:-essencia}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-essencia}
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      NETLIFY_AI_URL: https://netlify.ai
      NETLIFY_AI_TIMEOUT_MS: 5000
      MAX_UPLOAD_MB: 5
      UPLOAD_DIR: /app/uploads
      # Stripe: deixe MOCK=true até configurar a key real
      STRIPE_MOCK: ${STRIPE_MOCK:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PLATFORM_FEE_PCT: ${PLATFORM_FEE_PCT:-10}
      # Web Push
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@essencia-do-cuidar.app}
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "4000"
    # Sem porta exposta: nginx faz o proxy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: essencia-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  postgres_data:
  backend_uploads: