# ==========================================================================
# Netlify — Essência do Cuidar (frontend)
# ==========================================================================
# Este arquivo é detectado automaticamente pela Netlify ao conectar o repo
# Nexus-HUB57/Essencia_do_Cuidar. A cada push em `main` a Netlify rebuilda
# e republica o site automaticamente.
#
# Backend (Node + SQLite, stateful) NÃO roda em Netlify — precisa de host
# persistente. Ver DEPLOY.md para Render/Railway/fly.io.
# ==========================================================================

[build]
  base    = "frontend"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  # URL do backend. Ajuste no painel da Netlify (Site settings → Environment)
  # para apontar pro seu deploy do Render/Railway.
  VITE_API_URL = "/api"

# --------------------------------------------------------------------------
# 1) PROXY DO BACKEND (tem que vir ANTES do catch-all — a Netlify avalia
#    as regras de cima pra baixo e o /* engoliria tudo se vier primeiro)
# --------------------------------------------------------------------------
# Troque o host abaixo pelo seu. Exemplos:
#   https://essencia-backend.onrender.com
#   https://essencia-backend.up.railway.app
[[redirects]]
  from   = "/api/*"
  to     = "https://essencia-backend.onrender.com/api/:splat"
  status = 200
  force  = true

[[redirects]]
  from   = "/uploads/*"
  to     = "https://essencia-backend.onrender.com/uploads/:splat"
  status = 200
  force  = true

# WebSocket do Socket.IO — precisa deRewrite + force pra não cair no SPA
[[redirects]]
  from   = "/socket.io/*"
  to     = "https://essencia-backend.onrender.com/socket.io/:splat"
  status = 200
  force  = true

# --------------------------------------------------------------------------
# 2) SPA FALLBACK — sempre por último
# --------------------------------------------------------------------------
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# --------------------------------------------------------------------------
# 3) CACHE
# --------------------------------------------------------------------------
# Assets com hash no nome: imutáveis, cache de 1 ano
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker e manifest: nunca cacheados (precisam buscar versão nova)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Imagens da marca: cache médio (podem ser trocadas)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# --------------------------------------------------------------------------
# 4) VARIÁVEL DE AMBIENTE NECESSÁRIA
# --------------------------------------------------------------------------
# Se você NÃO usar os redirects de proxy acima, defina no painel:
#   Site settings → Environment variables → VITE_API_URL
#   valor: https://essencia-backend.onrender.com/api
# (a variável precisa existir no build, então é build-time, não runtime)