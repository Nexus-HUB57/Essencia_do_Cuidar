name: Diagnóstico Render

# Lista os serviços da conta Render usando RENDER_API_KEY e mostra:
# - quais serviços existem (nomes, ids, suspensos?)
# - os últimos deploys de cada web service e seus status
# Serve para diagnosticar estados "no-deploy" / 502 instantâneo / suspensão
# por limite de horas do plano free.
on:
  workflow_dispatch: {}

permissions: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consultar API do Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/diag-render.mjs
