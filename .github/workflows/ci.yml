name: CI — Smoke test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  smoke-test:
    name: Backend smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      # Nenhum serviço externo necessário — SQLite é local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Seed database
        working-directory: backend
        run: npm run seed

      - name: Start backend
        working-directory: backend
        run: |
          nohup node src/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          # Aguarda o servidor estar pronto
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Backend up após ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke test
        env:
          BASE: http://localhost:4000
        run: bash scripts/smoke-test.sh

      - name: Show backend logs (on failure)
        if: failure()
        run: |
          echo "--- Backend log ---"
          cat /tmp/backend.log || true

      - name: Stop backend
        if: always()
        run: |
          if [ -f /tmp/backend.pid ]; then
            kill $(cat /tmp/backend.pid) || true
          fi
