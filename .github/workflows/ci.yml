name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Seed database
        working-directory: backend
        run: npm run seed

      - name: Start backend
        working-directory: backend
        run: |
          nohup node src/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "Backend up após ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:4000/api/health || { cat /tmp/backend.log; exit 1; }

      # As seis suítes. `smoke-test.sh` cobre os fluxos gerais,
      # `smoke-test-v2.sh` as 6 features (PG, registros, Stripe, push, admin,
      # i18n), `smoke-test-matching.sh` o matching Vagas x Profissional,
      # `smoke-test-rag.sh` o assistente de busca semântica, a custódia
      # percorre o caminho completo do dinheiro via HTTP e a Netfly valida
      # a sincronização do webhook (entrega, falha, retry, health).
      - name: Smoke test — fluxos gerais
        env:
          BASE: http://localhost:4000
        run: bash scripts/smoke-test.sh

      - name: Smoke test — features
        env:
          BASE: http://localhost:4000
        run: bash scripts/smoke-test-v2.sh

      - name: Smoke test — matching
        env:
          BASE: http://localhost:4000
        run: bash scripts/smoke-test-matching.sh

<<<<<<< HEAD
      - name: Teste do script de deploy no Render (mock da API)
        run: bash scripts/test-render-deploy.sh
=======
      - name: Smoke test — assistente RAG
        env:
          BASE: http://localhost:4000
        run: bash scripts/smoke-test-rag.sh

      - name: Smoke test — custódia de plantão (jornada do dinheiro)
        run: python3 scripts/smoke-test-custodia.py http://localhost:4000

      # Autocontida: sobe o próprio receptor HTTP e uma instância do backend
