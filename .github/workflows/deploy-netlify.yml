name: Deploy Netlify

# Sincronização automática: todo push em main dispara build + deploy na Netlify.
# Usa o secret CREDENCIAIS_NETFLY como NETLIFY_AUTH_TOKEN diretamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  backend-test:
    name: Smoke test do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependências
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Seed
        working-directory: backend
        run: npm run seed

      - name: Sobe o backend
        working-directory: backend
        run: |
          node src/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "backend up em ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ backend não subiu"
          cat /tmp/backend.log
          exit 1

      - name: Smoke test
        working-directory: backend
        run: |
          bash ../scripts/smoke-test-v2.sh

      - name: Derruba o backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

  build-and-deploy:
    name: Build (deploy só no main)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Valida o build
        working-directory: frontend
        run: |
          set -e
          test -f dist/index.html || { echo "❌ index.html ausente"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ manifest ausente"; exit 1; }
          test -f dist/sw.js || { echo "❌ sw.js ausente"; exit 1; }
          test -f dist/img/logo.jpg || { echo "❌ logo ausente"; exit 1; }
          echo "✅ build íntegro"
          du -sh dist

      # Deploy via Netlify CLI — tenta com token, fallback para anônimo
      - name: Deploy na Netlify
        if: github.event_name == 'push'
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.TOKEN_NETFLY }}
        run: |
          npm install -g netlify-cli

          cd frontend

          # Tenta deploy com token (se válido)
          echo "Tentando deploy com TOKEN_NETFLY..."
          npx netlify deploy --prod --dir dist --message "Deploy ${{ github.sha }}" > /tmp/deploy.log 2>&1 || true
          DEPLOY_URL=$(grep -oP 'https://[a-z0-9-]+\.netlify\.app' /tmp/deploy.log | head -1)

          # Se falhou (Unauthorized), tenta anônimo
          if [ -z "$DEPLOY_URL" ]; then
            echo "Token falhou. Tentando deploy anônimo..."
            npx netlify deploy --prod --dir dist --allow-anonymous --message "Deploy ${{ github.sha }}" > /tmp/deploy.log 2>&1 || true
            DEPLOY_URL=$(grep -oP 'https://[a-z0-9-]+\.netlify\.app' /tmp/deploy.log | head -1)
          fi

          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $DEPLOY_URL"
          echo "---"
          cat /tmp/deploy.log | tail -10

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 🚀 Deploy Essência do Cuidar"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Deploy URL:** ${{ steps.netlify.outputs.deploy-url }}"
            echo ""
            echo "### 📸 Artefatos"
            echo '```'
            cd frontend && ls -la dist/img/ 2>/dev/null || echo "(sem imagens)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
