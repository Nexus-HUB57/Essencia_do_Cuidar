name: Deploy Netlify

# Sincronização automática: todo push em main dispara build + deploy na Netlify.
# Usa o secret CREDENCIAIS_NETFLY como NETLIFY_AUTH_TOKEN diretamente.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build e deploy na Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Valida o build
        working-directory: frontend
        run: |
          set -e
          test -f dist/index.html || { echo "❌ index.html ausente"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ manifest ausente"; exit 1; }
          test -f dist/sw.js || { echo "❌ sw.js ausente"; exit 1; }
          test -f dist/img/logo.jpg || { echo "❌ logo ausente"; exit 1; }
          echo "✅ build íntegro"
          du -sh dist

      # Usa CREDENCIAIS_NETFLY diretamente como token de auth da Netlify
      - uses: nwtgck/actions-netlify@v3
        id: netlify
        with:
          publish-dir: ./frontend/dist
          deploy-message: "Deploy ${{ github.sha }} — ${{ github.actor }}"
          enable-pull-request-comment: false
          alias: deploy-preview-${{ github.run_number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.CREDENCIAIS_NETFLY }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 🚀 Deploy Essência do Cuidar"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Deploy URL:** ${{ steps.netlify.outputs.deploy-url }}"
            echo ""
            echo "### 📸 Artefatos"
            echo '```'
            cd frontend && ls -la dist/img/ 2>/dev/null || echo "(sem imagens)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
