name: Deploy Netlify

# Sincronização automática: todo push em main dispara build + deploy na Netlify.
# Usa o secret CREDENCIAIS_NETFLY como NETLIFY_AUTH_TOKEN diretamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # MESMO grupo do deploy-e2e.yml: os dois publicam na Netlify e, se
  # rodarem em paralelo (mesmo push), o netlify-cli recebe "JSONHTTPError:
  # Forbidden" — só um deploy por vez.
  group: deploy-producao
  cancel-in-progress: false

jobs:
  backend-test:
    name: Smoke test do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependências
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Seed
        working-directory: backend
        run: npm run seed

      - name: Sobe o backend
        working-directory: backend
        run: |
          node src/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "backend up em ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ backend não subiu"
          cat /tmp/backend.log
          exit 1

      - name: Smoke test
        working-directory: backend
        run: |
          bash ../scripts/smoke-test-v2.sh

      - name: Derruba o backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

  build-and-deploy:
    name: Build (deploy só no main)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Valida o build
        working-directory: frontend
        run: |
          set -e
          test -f dist/index.html || { echo "❌ index.html ausente"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ manifest ausente"; exit 1; }
          test -f dist/sw.js || { echo "❌ sw.js ausente"; exit 1; }
          test -f dist/img/logo.jpg || { echo "❌ logo ausente"; exit 1; }
          echo "✅ build íntegro"
          du -sh dist

      # Gate de configuração do Netlify: netlify.toml precisa ser TOML válido e
      # as regras /api/*, /uploads/* e /socket.io/* precisam vir ANTES do
      # catch-all /* — senão o catch-all engole o proxy e a API morre.
      # O script também reconstrói o frontend, então leva o mesmo VITE_API_URL.
      - name: Validação pré-deploy (netlify.toml + redirects + PWA)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: bash scripts/netlify-pre-deploy-check.sh

      # Deploy via Netlify CLI — testa os secrets via API, usa o que funcionar,
      # resolve o site-id e publica --prod. Falha RUIDOSAMENTE se não publicar
      # (a integração Git da Netlify está sem publicar os pushes novos).
      - name: Deploy na Netlify
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: netlify
        env:
          NETLIFY_TOKEN_A: ${{ secrets.CREDENCIAIS_NETFLY }}
          NETLIFY_TOKEN_B: ${{ secrets.TOKEN_NETFLY }}
        run: |
          npm install -g netlify-cli

          cd frontend

          USADO=""
          SITE_ID=""
          i=0
          for T in "$NETLIFY_TOKEN_A" "$NETLIFY_TOKEN_B"; do
            i=$((i+1))
            [ -n "$T" ] || { echo "Secret $i: vazio"; continue; }
            # sanitiza: remove quebras de linha, espaços e aspas (segredos
            # colados com JSON/quebras quebram o header do curl -> HTTP 000)
            TSAN=$(printf '%s' "$T" | tr -d '\r\n\t "')
            if [ "$TSAN" != "$T" ]; then echo "Secret $i: valor sanitizado (continha quebras/aspas/espaços)"; fi
            # se veio embrulhado em JSON, extrai o campo token
            case "$TSAN" in
              \{*) TSAN=$(printf '%s' "$TSAN" | python3 -c "
          import json, sys
          try:
              d = json.load(sys.stdin)
              print(d.get('token') or d.get('api_token') or d.get('NETLIFY_AUTH_TOKEN') or '')
          except Exception:
              pass")" ;;
            esac
            [ -n "$TSAN" ] || { echo "Secret $i: vazio após sanitização"; continue; }
            echo "Secret $i: len=${#TSAN} prefixo=$(printf '%s' "$TSAN" | cut -c1-3)…"
            WHO=$(curl -s -m 20 -o /tmp/user.json -w "%{http_code}" -H "Authorization: Bearer $TSAN" https://api.netlify.com/api/v1/user || echo curl_erro)
            echo "Secret $i: GET /api/v1/user -> HTTP $WHO | conta: $(python3 -c "
          import json
          try:
              u = json.load(open('/tmp/user.json'))
              print((u.get('email') or u.get('full_name') or '?'))
          except Exception:
              print('?')" 2>/dev/null || echo '?')"
            CODE=$(curl -s -m 20 -o /tmp/sites.json -w "%{http_code}" -H "Authorization: Bearer $TSAN" https://api.netlify.com/api/v1/sites || echo curl_erro)
            echo "Secret $i: GET /api/v1/sites -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              USADO="$TSAN"
              SITE_ID=$(python3 -c "
          import json
          try:
              sites = json.load(open('/tmp/sites.json'))
              def alvo(s):
                  campos = ' '.join([s.get('name') or '', s.get('ssl_url') or '', s.get('custom_domain') or ''] + list(s.get('domain_aliases') or []))
                  return 'essenciadocuidar' in campos
              cand = [s for s in sites if alvo(s)]
              print(cand[0]['id'] if cand else '')
          except Exception:
              pass")
              echo "Sites na conta: $(python3 -c "
          import json
          try:
              sites = json.load(open('/tmp/sites.json'))
              print(' | '.join(f\"{s.get('name')} id={s.get('id')} dominios={s.get('domain_aliases')}\" for s in sites[:20]) or '(vazio)')
          except Exception:
              print('(erro ao ler)')")"
              echo "site-id selecionado: ${SITE_ID:-NAO_ENCONTRADO}"
              if [ -n "$SITE_ID" ]; then break; fi
            fi
          done

          [ -n "$USADO" ] || { echo "::error::Nenhum secret Netlify válido (HTTP != 200). O token precisa ser CLÁSSICO e de acesso total, criado na conta dona do site essenciadocuidar."; exit 1; }
          [ -n "$SITE_ID" ] || { echo "::error::O token autentica numa conta que NÃO possui o site essenciadocuidar (veja 'Sites na conta' acima). Crie o Personal Access Token NA CONTA DONA do site (app.netlify.com → selecione o site essenciadocuidar) e atualize o secret TOKEN_NETFLY."; exit 1; }

          export NETLIFY_AUTH_TOKEN="$USADO"
          echo "Publicando em produção (site $SITE_ID)..."
          RC=0
          npx netlify deploy --prod --site "$SITE_ID" --dir dist --message "Deploy ${{ github.sha }}" > /tmp/deploy.log 2>&1 || RC=$?
          echo "--- deploy.log (tail 40) ---"
          tail -40 /tmp/deploy.log
          echo "--------------------------"
          if [ $RC -ne 0 ]; then
            echo "::error::netlify deploy falhou (rc=$RC) — ver tail acima."
            exit $RC
          fi
          DEPLOY_URL=$(grep -oP 'Website URL:\s*\Khttps://\S+' /tmp/deploy.log | head -1)
          [ -n "$DEPLOY_URL" ] || DEPLOY_URL=$(grep -oP 'https://[a-z0-9-]+\.netlify\.app' /tmp/deploy.log | head -1)
          echo "deploy-url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deploy URL: $DEPLOY_URL"
          [ -n "$DEPLOY_URL" ] || { echo "::error::Deploy sem erro explícito, mas nenhuma URL de publicação foi detectada."; exit 1; }

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 🚀 Deploy Essência do Cuidar"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Deploy URL:** ${{ steps.netlify.outputs.deploy-url }}"
            echo ""
            echo "### 📸 Artefatos"
            echo '```'
            cd frontend && ls -la dist/img/ 2>/dev/null || echo "(sem imagens)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
