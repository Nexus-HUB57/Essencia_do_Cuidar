name: Deploy Netlify

# Sincronização automática: todo push em main dispara build + deploy na Netlify.
# Usa o secret CREDENCIAIS_NETFLY como NETLIFY_AUTH_TOKEN diretamente.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: netlify-deploy
  cancel-in-progress: true

jobs:
  backend-test:
    name: Smoke test do backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependências
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Seed
        working-directory: backend
        run: npm run seed

      - name: Sobe o backend
        working-directory: backend
        run: |
          node src/index.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/api/health > /dev/null; then
              echo "backend up em ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "❌ backend não subiu"
          cat /tmp/backend.log
          exit 1

      - name: Smoke test
        working-directory: backend
        run: |
          bash ../scripts/smoke-test-v2.sh

      - name: Derruba o backend
        if: always()
        run: kill $(cat /tmp/backend.pid) 2>/dev/null || true

  build-and-deploy:
    name: Build (deploy só no main)
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependências
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Valida o build
        working-directory: frontend
        run: |
          set -e
          test -f dist/index.html || { echo "❌ index.html ausente"; exit 1; }
          test -f dist/manifest.webmanifest || { echo "❌ manifest ausente"; exit 1; }
          test -f dist/sw.js || { echo "❌ sw.js ausente"; exit 1; }
          test -f dist/img/logo.jpg || { echo "❌ logo ausente"; exit 1; }
          echo "✅ build íntegro"
          du -sh dist

      # Extrai credenciais: TOKEN_NETFLY (auth token) + CREDENCIAIS_NETFLY (site_id)
      - name: Extrair credenciais Netlify
        if: github.event_name == 'push'
        id: creds
        env:
          TOKEN_NETFLY: ${{ secrets.TOKEN_NETFLY }}
          CREDENCIAIS_NETFLY: ${{ secrets.CREDENCIAIS_NETFLY }}
        run: |
          # TOKEN_NETFLY = auth token (Personal Access Token da Netlify)
          AUTH_TOKEN=$(echo "$TOKEN_NETFLY" | tr -d '\n\r ')

          # Site ID: tenta extrair de CREDENCIAIS_NETFLY (linha 2 ou JSON)
          SITE_ID=$(echo "$CREDENCIAIS_NETFLY" | sed -n '2p' | tr -d '\n\r ')
          if [ -z "$SITE_ID" ]; then
            SITE_ID=$(echo "$CREDENCIAIS_NETFLY" | python3 -c "
          import json,sys
          try:
            d=json.load(sys.stdin)
            print(d.get('NETLIFY_SITE_ID',d.get('site_id',d.get('siteId',''))))
          except: pass
          " 2>/dev/null)
          fi

          echo "auth_token=$AUTH_TOKEN" >> "$GITHUB_OUTPUT"
          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "Token: ${#AUTH_TOKEN} chars | Site ID: ${#SITE_ID} chars"

      - uses: nwtgck/actions-netlify@v3
        id: netlify
        if: github.event_name == 'push'
        with:
          publish-dir: ./frontend/dist
          deploy-message: "Deploy ${{ github.sha }} — ${{ github.actor }}"
          enable-pull-request-comment: false
          alias: deploy-preview-${{ github.run_number }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ steps.creds.outputs.auth_token }}
          NETLIFY_SITE_ID: ${{ steps.creds.outputs.site_id }}

      - name: Resumo
        if: always()
        run: |
          {
            echo "### 🚀 Deploy Essência do Cuidar"
            echo ""
            echo "- **Commit:** \`${{ github.sha }}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Deploy URL:** ${{ steps.netlify.outputs.deploy-url }}"
            echo ""
            echo "### 📸 Artefatos"
            echo '```'
            cd frontend && ls -la dist/img/ 2>/dev/null || echo "(sem imagens)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
