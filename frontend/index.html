<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#4A90E2" />
    <meta name="description" content="Essência do Cuidar — marketplace de profissionais de saúde para cuidado domiciliar de idosos e pacientes de baixa e média complexidade." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <title>Essência do Cuidar — Cuidado domiciliar com confiança</title>
    <!-- Open Graph / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Essência do Cuidar" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Essência do Cuidar — Marketplace de cuidados" />
    <meta property="og:description" content="Conectamos famílias e clínicas a profissionais de saúde verificados para cuidado domiciliar com confiança, empatia e segurança." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Essência do Cuidar — marketplace de profissionais de saúde para cuidado domiciliar" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Essência do Cuidar — Marketplace de cuidados" />
    <meta name="twitter:description" content="Profissionais de saúde verificados para o cuidado domiciliar de idosos." />
    <meta name="twitter:image" content="/og-image.png" />
    <script>
      // Aplica o tema antes do React montar (evita flash)
      (function() {
        try {
          var t = localStorage.getItem('essencia_tema');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
